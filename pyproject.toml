[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-science-agent-network"
version = "0.1.0"
description = "A BYOK and agent-client volunteer network for auditable open science tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Science Agent Network contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
osan-server = "osan.server:main"
osan-worker = "osan.worker:main"
osan-validate-result = "osan.validator:main"
osan-validate-task = "osan.validator:task_main"
osan-validate-task-manifest = "osan.task_manifest:main"

[tool.setuptools.packages.find]
where = ["src"]
